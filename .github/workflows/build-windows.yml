# يبني نسخة ويندوز المحمولة (للفلاش) ويرفعها كملف قابل للتحميل من صفحة Actions.
name: بناء نسخة ويندوز

on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # مترجم C من Visual Studio لبناء rawmouse.exe (قارئ الفئران المنفصلة لوضع المقعدين)
      - uses: ilammy/msvc-dev-cmd@v1
      - run: npm run build:native
      - name: التحقق من وجود rawmouse.exe
        shell: pwsh
        run: if (!(Test-Path native/bin/rawmouse.exe)) { throw 'rawmouse.exe لم يُبنَ' }
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ArabicExams-windows-portable
          path: release/*.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ArabicExams-windows-zip
          path: release/*.zip
          retention-days: 30
